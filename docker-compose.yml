services:
  mysql:
    image: mysql:9.0
    container_name: baseapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root@1234
      MYSQL_DATABASE: BaseApiDb
      MYSQL_USER: baseapi_user
      MYSQL_PASSWORD: BaseApi2026@
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
